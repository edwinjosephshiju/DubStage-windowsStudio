name: Build & Package Windows MSIX

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package MSIX
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Generate Code Signing Certificate (Store Dev / Sideloading)
        shell: pwsh
        run: |
          Write-Host "Creating self-signed code signing certificate matching Package.appxmanifest Publisher (CN=DubStageStudioDev)..."
          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject "CN=DubStageStudioDev" `
            -KeyUsage DigitalSignature `
            -FriendlyName "DubStage Studio Code Signing" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")

          $pwd = ConvertTo-SecureString -String "DubStage123!" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath "DubStageTestCert.pfx" -Password $pwd
          Export-Certificate -Cert $cert -FilePath "DubStageTestCert.cer"

          # Import into LocalMachine Root & TrustedPeople for build runner trust
          Import-Certificate -FilePath "DubStageTestCert.cer" -CertStoreLocation "Cert:\LocalMachine\Root"
          Import-Certificate -FilePath "DubStageTestCert.cer" -CertStoreLocation "Cert:\LocalMachine\TrustedPeople"
          
          # Pass thumbprint to environment for MSBuild signing
          "CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Certificate generated with Thumbprint: $($cert.Thumbprint)"

      - name: Restore NuGet Dependencies
        shell: pwsh
        run: |
          dotnet restore DubStage.csproj -r win-x64

      - name: Build and Package MSIX
        shell: pwsh
        run: |
          msbuild DubStage.csproj `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:RuntimeIdentifier=win-x64 `
            /p:GenerateAppxPackageOnBuild=true `
            /p:AppxPackageSigningEnabled=true `
            /p:PackageCertificateThumbprint="${{ env.CERT_THUMBPRINT }}" `
            /p:AppxPackageDir="./AppPackages/" `
            /p:AppxBundle=Never `
            /p:WindowsAppSDKSelfContained=true `
            /p:SelfContained=true `
            /v:minimal

      - name: Verify Package & Generate SHA256 Checksums
        shell: pwsh
        run: |
          Write-Host "Scanning generated packages..."
          Get-ChildItem -Path ./AppPackages/ -Recurse

          $msixFiles = Get-ChildItem -Path ./AppPackages/ -Filter "*.msix" -Recurse
          if ($msixFiles.Count -eq 0) {
            Write-Error "No .msix package was generated!"
            exit 1
          }

          Write-Host "Found MSIX: $($msixFiles[0].FullName)"
          $hash = (Get-FileHash -Path $msixFiles[0].FullName -Algorithm SHA256).Hash
          Write-Host "SHA-256 Checksum: $hash"
          "$hash  $($msixFiles[0].Name)" | Out-File -FilePath "./AppPackages/SHA256SUMS.txt" -Encoding utf8
          Copy-Item -Path "DubStageTestCert.cer" -Destination "./AppPackages/"

      - name: Upload MSIX Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DubStage-Windows-MSIX
          path: ./AppPackages/
          retention-days: 14
